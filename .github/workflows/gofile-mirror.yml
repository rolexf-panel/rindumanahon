name: Gofile Mirror Bot (Enhanced)

on:
  workflow_dispatch:
    inputs:
      download_url:
        description: 'URL file yang akan di-download'
        required: true
        type: string
      gofile_server:
        description: 'Gofile server (kosongkan untuk auto/Singapore)'
        required: false
        type: choice
        options:
          - 'auto (Singapore priority)'
          - 'store1'
          - 'store2'
          - 'store3'
          - 'store4'
          - 'store5'
          - 'store6'
          - 'store7'
          - 'store8'
        default: 'auto (Singapore priority)'
      keep_local_file:
        description: 'Keep file after upload (for debugging)'
        required: false
        type: boolean
        default: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max for very large files
    
    steps:
    - name: 🔄 Checkout Repository
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install Dependencies
      run: |
        pip install requests tqdm
    
    - name: 📥 Download and Upload to Gofile
      env:
        DOWNLOAD_URL: ${{ inputs.download_url }}
        GOFILE_SERVER: ${{ inputs.gofile_server }}
        KEEP_LOCAL_FILE: ${{ inputs.keep_local_file }}
      run: |
        python gofile_bot.py
    
    - name: 📊 Display Results
      if: always()
      run: |
        if [ -f gofile_result.txt ]; then
          echo "=== UPLOAD RESULT ==="
          cat gofile_result.txt
        else
          echo "❌ No result file found"
        fi
    
    - name: 📁 Upload Error Logs (if any)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-logs
        path: |
          gofile_error_response.txt
          gofile_result.txt
        if-no-files-found: ignore
